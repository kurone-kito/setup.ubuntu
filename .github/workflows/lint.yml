name: Linting workflow
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
run-name: ${{ github.event_name }} by @${{ github.actor }}
jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run cspell
        uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v9.1.0
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      - name: Run shellcheck
        # Lints setup and nuke (detected via their #!/bin/sh shebang),
        # lib/*.sh, and tests/*.sh; .githooks is upstream-managed template
        # code and excluded.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          ignore_paths: .githooks
      - name: Run the setup CLI smoke test
        run: ./tests/setup-cli.test.sh
      - name: Run stale-exempt
        run: bash tests/stale-exempt.test.sh
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
    timeout-minutes: 15
