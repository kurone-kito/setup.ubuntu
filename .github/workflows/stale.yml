concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
name: Mark stale issues
on:
  schedule:
    - cron: '0 0 * * 1'
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v10
        with:
          days-before-close: 60
          days-before-stale: 60
          close-issue-message: StaleBot closed the issue due to prolonged inactivity.
          close-pr-message: StaleBot closed the pull request due to prolonged inactivity.
          # The four IDD labels below mirror the policy keys in
          # .github/idd/config.json: labels.roadmapLabelName (roadmap),
          # labels.blockedByHumanLabelName (status:blocked-by-human),
          # labels.needsDecisionLabelName (status:needs-decision), and
          # issueAuthoring.authoringLabelName (status:authoring; the repo does
          # not set it, so the default applies). Each one marks an issue IDD
          # deliberately parks without activity; a label rename in config.json
          # needs the matching entry updated here. durable-record is
          # repository-only: it is not an IDD label, marks no parked issue, and
          # keeps the two durable records (#158, #163) open.
          exempt-issue-labels: bug,enhancement,roadmap,status:blocked-by-human,status:needs-decision,status:authoring,durable-record
          exempt-pr-labels: bug,enhancement
          stale-issue-label: stale
          stale-issue-message: StaleBot marked the issue as stale because there has been no activity.
          stale-pr-label: stale
          stale-pr-message: StaleBot marked the pull request as stale because there has been no activity.
    timeout-minutes: 5
