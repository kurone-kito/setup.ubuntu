name: IDD advisory-convergence gate
# Optional, opt-in required-check workflow, hosted (but deliberately not
# registered as a required status check) since roadmap #48/#47 added it
# (see docs/idd-policy.md's "Helper runtime (ephemeral-npx)" section for
# the required-check Ruleset registration decision and the
# waiver-after-deadline escape path).
#
# This repository adapts the upstream idd-template/ copy of this file to
# its own ephemeral-npx helper-runtime profile (.github/idd/config.json
# helperRuntime.profile): the checkout step and the verdict invocation
# stay on this repo's existing pinned-checkout / npx form (matching
# idd-doctor.yml) rather than upstream's generic actions/setup-node +
# `node scripts/advisory-convergence.mjs` form, which assumes a vendored
# scripts/ directory this repository does not have. `runs-on` follows
# upstream's runner-override chain (the `runner` input / `CI_RUNNER_LABEL`
# variable), defaulting to `ubuntu-slim` to match this repo's own
# convention. See docs/idd-policy.md's "Helper runtime (ephemeral-npx)"
# section for the pinned-SHA sync obligation this file participates in.
#
# The self-waiver job below applies the same ephemeral-npx-only
# adaptation: this repository has no `scripts/` directory and no
# `package.json`/lockfile (see docs/idd-policy.md), so the upstream
# job's `vendored-node`/`package-manager` branches, its profile-resolution
# scaffolding, and its `instructions-only` fail-open notice are all dead
# code here and are omitted; the job runs the single ephemeral-npx
# invocation directly, mirroring the verdict job above.
concurrency:
  cancel-in-progress: true
  # Grouped by PR number, not github.ref: pull_request_target resolves
  # github.ref to the base branch (the same value for every PR targeting
  # it), so grouping by ref would collapse unrelated PRs into one slot.
  # Review-thread comments and review submissions live in the companion
  # idd-advisory-convergence-comment.yml workflow and must not share
  # this group. Isolate workflow_dispatch so a manual re-check cannot
  # cancel an in-flight PR-linked run. Also isolate pull_request from
  # pull_request_target (both fire on the same opened/synchronize PR
  # event): otherwise whichever instance started later could cancel the
  # other mid-run, including the pull_request_target instance's own
  # idd-advisory-convergence-self-waiver job, which would then never
  # finish posting the bootstrap marker for that push (kurone-kito/idd-skill#2657).
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.pr_number) || format('{0}-{1}', github.event_name, github.event.pull_request.number || inputs.pr_number) }}
on:
  # Trigger-migration transition state: pull_request is evaluated
  # against the pull request's own merge ref, so a same-repository PR
  # could edit this file's copy to force its own required check green.
  # pull_request_target closes that gap -- it is evaluated against the
  # base branch's own workflow YAML instead -- but cannot fire against
  # the PR that first adds or edits this trigger, only against PRs
  # opened afterward, so both stay active together rather than a
  # single-PR replacement that would leave the implementing PR unable
  # to satisfy its own required check. Drop pull_request once this has
  # run cleanly on production PRs for a period. pull_request_review
  # moved to the companion idd-advisory-convergence-comment.yml
  # workflow instead of staying here, for the identical reason.
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check (e.g. after posting a maintainer waiver)
        required: true
        type: number
      runner:
        description: Runner label (default ubuntu-slim; falls back to
          the CI_RUNNER_LABEL repository variable, then ubuntu-slim,
          when left unset)
        required: false
        type: string
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
      pr_number:
        description: PR number when this workflow is called without a pull_request event
        required: true
        type: number
permissions:
  contents: read
  issues: read
  pull-requests: read
defaults:
  run:
    # Pins every run: step's shell regardless of runner OS -- GitHub
    # Actions otherwise picks bash on Linux/macOS but PowerShell Core
    # on Windows, which would silently misinterpret this file's POSIX
    # shell syntax (e.g. "$PR_NUMBER" as an undefined PowerShell
    # variable) instead of failing loudly. Available on every
    # GitHub-hosted runner, including Windows via Git Bash, so this is
    # a no-op on the runners this template ships for today.
    shell: bash
jobs:
  # The job id `idd-advisory-convergence` is the exact check-run context
  # consumed by the rerun helper, advisory-wait policy, required status
  # check, and external-check waiver selector. Adding a `name:` display-name
  # key or changing the job id changes that literal context. This warning is
  # preventive; no observed incident yet. If either edit is intentional,
  # update every consumer to the new literal context together.
  idd-advisory-convergence:
    # See the header comment above for the runner / CI_RUNNER_LABEL override.
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_LABEL || 'ubuntu-slim' }}
    # Bounds pathological hangs; adjust to your own observed run duration
    # once you have history (see idd-doctor.yml/lint.yml in the source
    # repository for the pattern of sizing this from real run durations).
    timeout-minutes: 10
    # kurone-kito/idd-skill#2657: sequenced after the self-waiver job below
    # so an allowlisted PR's own bootstrap marker is guaranteed to exist
    # (posted or definitively not posted) before this job ever fetches PR
    # comments -- without this ordering, the two jobs share no dependency
    # and start in parallel, so this (typically much faster) job can read
    # comments and fail BEFORE the self-waiver job finishes its diff
    # check, claim resolution, and posting call. `if: ${{ !cancelled() }}`
    # overrides `needs:`'s own default (a skipped dependency job skips its
    # dependents too) -- this job must still run on every trigger,
    # including `workflow_dispatch` or a `pull_request` run where the
    # self-waiver job's own `if:` skips it outright.
    needs: idd-advisory-convergence-self-waiver
    if: ${{ !cancelled() }}
    # Job-level override of the workflow-level `permissions:` block above,
    # adding `actions: read` (kurone-kito/idd-skill#2657): the
    # self-referential-bootstrap-auto trust verification calls
    # `GET /repos/{owner}/{repo}/actions/runs/{id}`, which needs this scope
    # explicitly in a private repository. A job-level block replaces the
    # workflow-level one entirely rather than adding to it, so every
    # previously-granted scope is repeated here too.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted default-branch checkout, never the PR head, for any
          # trigger type including workflow_dispatch -- a PR must not be
          # able to edit its own verdict logic or .github/idd/config.json
          # to force this check green. --pr below still evaluates the
          # right PR: every live API call is driven by that flag, not by
          # what's checked out locally.
          ref: main
          persist-credentials: false
      - name: Run advisory-convergence verdict (--assert)
        env:
          GH_TOKEN: ${{ github.token }}
          # gh reads whichever of these two matches its resolved host
          # (`gh help environment`), so setting both is inert on
          # github.com and lets this same step authenticate on a
          # self-hosted GHES host too.
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # workflow_dispatch's `pr_number` input is `type: number` in the
          # UI, but that constraint is not strictly enforced for direct API
          # dispatches, so route it through env: and reference it as a
          # quoted shell variable rather than interpolating the `${{ }}`
          # expression directly into the run: script.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: >-
          npx --yes --package
          https://codeload.github.com/kurone-kito/idd-skill/tar.gz/11105d705820e50be0a14fcc174587abbaf62b30
          idd-advisory-convergence
          --pr "$PR_NUMBER"
          --assert

  # kurone-kito/idd-skill#2657: optional companion job -- a PR that fixes
  # this gate's own checking logic (or a handful of directly-related
  # files) can never benefit from its own fix while unmerged, because the
  # verdict job above always runs the version checked out from `main`.
  # This job auto-posts a narrowly-scoped, run-bound
  # `idd-external-check-waiver` marker for exactly that case. See
  # docs/idd-helper-scripts.md's "External-check waiver contract"
  # (self-referential-bootstrap-auto section) for the full trust model
  # and the acceptance conditions `advisory-convergence.mts` verifies
  # before ever honoring the marker -- this job's only role is to detect
  # the trigger and post it; trust is established entirely at consume
  # time, not here.
  #
  # `if: pull_request_target` only, never `pull_request`: a
  # same-repository PR editing this YAML could otherwise also run this
  # job under a `pull_request`-triggered instance it fully controls. The
  # consumer's own trust conditions would reject a marker from that
  # instance anyway, but gating the job itself here avoids granting
  # `issues: write` under an untrusted-YAML trigger in the first place.
  #
  # Adapted for ephemeral-npx the same way the verdict job above is: no
  # profile-resolution scaffolding, no vendored-node/package-manager
  # branches, no setup-node step -- this repository has neither a
  # scripts/ directory nor a package.json/lockfile (docs/idd-policy.md's
  # "Helper runtime (ephemeral-npx)" section), so ephemeral-npx is the
  # only reachable profile and the single hardcoded npx invocation below
  # is unconditional.
  idd-advisory-convergence-self-waiver:
    if: github.event_name == 'pull_request_target'
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_LABEL || 'ubuntu-slim' }}
    timeout-minutes: 10
    # Narrower than the verdict job's read-only posture above: this job
    # needs `pull-requests: write` (to diff/fetch the PR, and -- this is
    # the load-bearing grant -- to actually post the marker below) and
    # `issues: write` (to post the marker, and to read the linked issue's
    # own comment stream to resolve its active claim). kurone-kito/idd-skill#2951:
    # with only `pull-requests: read`, the marker POST failed with HTTP
    # 403 "Resource not accessible by integration", confirmed by a live
    # A/B test. Do not narrow `pull-requests` back to `read` without
    # re-running an equivalent live test.
    # `checks: read` / `statuses: read` (kurone-kito/idd-skill#2995): the
    # `--auto-bootstrap` path also reads `pr.statusCheckRollup`, which
    # needs both scopes explicitly.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted default-branch checkout, not the PR head -- see the
          # verdict job's own comment above for the full rationale. This
          # job's posting logic (external-check-waiver) must be the
          # trusted copy too, or a PR could edit it to post a
          # differently-shaped marker or waive an unrelated check.
          ref: main
          persist-credentials: false
      - name: Detect self-referential trigger-file allowlist touch
        id: allowlist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # This repository's own checker-version pin lives entirely in
          # .github/idd/config.json's helperRuntime.packageSpec -- there
          # is no local scripts/*.mjs or package.json/lockfile checker
          # surface to also allowlist (unlike upstream's vendored-node /
          # package-manager branches), so the allowlist is just the two
          # workflow files plus the config file.
          #
          # `gh pr diff --name-only` reports a renamed file only by its
          # NEW name, never the old one, so a rename away from an
          # allowlisted path would leave this check false and post no
          # marker at all. Read the PR files REST endpoint directly
          # instead, which reports both `filename` and (when present)
          # `previous_filename` for a renamed entry.
          #
          # kurone-kito/idd-skill#3104: this raw `gh api` call always
          # targeted `github.com` regardless of the runner's actual host --
          # `GH_ENTERPRISE_TOKEN` above only covers auth, not host
          # targeting. Mirror `gh-exec.mts`'s `resolveGhApiHostname` (#1962)
          # in shell: respect an already-set `GH_HOST`; otherwise derive the
          # host from the Actions-provided `GITHUB_SERVER_URL`, and only
          # pass `--hostname` when that host is non-empty and not
          # `github.com`, so GitHub.com-hosted runs keep their existing argv
          # unchanged.
          ALLOWLIST=(
            ".github/idd/config.json"
            ".github/workflows/idd-advisory-convergence.yml"
            ".github/workflows/idd-advisory-convergence-comment.yml"
          )
          GH_API_HOSTNAME_ARGS=()
          if [ -z "${GH_HOST:-}" ]; then
            SERVER_HOST=$(printf '%s' "$GITHUB_SERVER_URL" \
              | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##; s#/+$##' \
              | tr '[:upper:]' '[:lower:]')
            if [ -n "$SERVER_HOST" ] && [ "$SERVER_HOST" != "github.com" ]; then
              GH_API_HOSTNAME_ARGS=(--hostname "$SERVER_HOST")
            fi
          fi
          CHANGED=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" \
            "${GH_API_HOSTNAME_ARGS[@]}" \
            --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          TOUCHED=false
          for FILE in "${ALLOWLIST[@]}"; do
            if grep -qxF "$FILE" <<<"$CHANGED"; then
              TOUCHED=true
              break
            fi
          done
          echo "touched=$TOUCHED" >> "$GITHUB_OUTPUT"
      - name: Post the self-referential-bootstrap-auto waiver
        # Skip a fork PR entirely: the consumer's run-bound trust check
        # would reject it anyway (a fork's own workflow run never matches
        # this repository), so this avoids a doomed post and the API
        # calls it would cost.
        if: steps.allowlist.outputs.touched == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        id: post-waiver
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes --package \
            https://codeload.github.com/kurone-kito/idd-skill/tar.gz/11105d705820e50be0a14fcc174587abbaf62b30 \
            idd-external-check-waiver --pr "$PR_NUMBER" --check idd-advisory-convergence \
            --reason self-referential-bootstrap-auto --run-id "$GITHUB_RUN_ID" \
            --auto-bootstrap --apply --yes | tee /tmp/idd-waiver-report.json
          APPLIED=$(node -e '
            try {
              const report = JSON.parse(require("fs").readFileSync("/tmp/idd-waiver-report.json", "utf8"));
              process.stdout.write(String(report.applied ?? false));
            } catch {
              process.stdout.write("false");
            }
          ')
          COMMENT_ID=$(node -e '
            try {
              const report = JSON.parse(require("fs").readFileSync("/tmp/idd-waiver-report.json", "utf8"));
              process.stdout.write(String(report.commentId ?? ""));
            } catch {
              process.stdout.write("");
            }
          ')
          BODY_DIGEST=$(node -e '
            try {
              const report = JSON.parse(require("fs").readFileSync("/tmp/idd-waiver-report.json", "utf8"));
              process.stdout.write(String(report.bodyDigest ?? ""));
            } catch {
              process.stdout.write("");
            }
          ')
          {
            echo "applied=$APPLIED"
            echo "comment-id=$COMMENT_ID"
            echo "body-digest=$BODY_DIGEST"
          } >> "$GITHUB_OUTPUT"
      - name: Record the posted marker's provenance
        # A run-scoped Actions artifact naming the EXACT comment id AND
        # body digest this run's own trusted job just posted -- the
        # binding primitive the consumer reads to prove a candidate
        # marker IS the one this run's own execution posted. Only when a
        # NEW comment was actually posted this run (`applied == 'true'`)
        # -- the reuse path (an existing valid waiver found, nothing
        # newly posted) has no comment of THIS run's own to record.
        # Needs no `permissions:` entry: `actions/upload-artifact` uses
        # the Actions runtime's own dedicated upload token, entirely
        # separate from `GITHUB_TOKEN`.
        if: steps.post-waiver.outputs.applied == 'true' && steps.post-waiver.outputs.comment-id != '' && steps.post-waiver.outputs.body-digest != ''
        env:
          COMMENT_ID: ${{ steps.post-waiver.outputs.comment-id }}
          BODY_DIGEST: ${{ steps.post-waiver.outputs.body-digest }}
        run: |
          mkdir -p /tmp/idd-self-waiver-marker
          printf 'commentId=%s\nbodyDigest=%s\n' "$COMMENT_ID" "$BODY_DIGEST" \
            > "/tmp/idd-self-waiver-marker/idd-self-waiver-marker-${COMMENT_ID}-${BODY_DIGEST}"
      - name: Upload the posted marker's provenance artifact
        # v4+ has no GHES Artifacts backend (GHES needs v3.2.2); see
        # kurone-kito/idd-skill#2918 and docs/onboarding/optional-host-setup.md.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.post-waiver.outputs.applied == 'true' && steps.post-waiver.outputs.comment-id != '' && steps.post-waiver.outputs.body-digest != ''
        with:
          name: idd-self-waiver-marker-${{ steps.post-waiver.outputs.comment-id }}-${{ steps.post-waiver.outputs.body-digest }}
          path: /tmp/idd-self-waiver-marker/
          # Loud failure, not a silent empty artifact, if the previous
          # step somehow produced no file -- the consumer's own binding
          # check already fails closed on a missing artifact either way,
          # but this surfaces the CI-side bug immediately instead of only
          # as a downstream "no auto-waiver" symptom.
          if-no-files-found: error
          # Deliberately NOT retention-days: 1 -- a later re-evaluation
          # can run well after this run finishes, and the marker's own
          # validity window outlives a short artifact retention -- keep
          # the repository default so the artifact stays listable for
          # the marker's full validity window.
